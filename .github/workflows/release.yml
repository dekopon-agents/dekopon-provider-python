name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: dekopon-agents/provider-workflows/.github/workflows/release.yml@e4f30a669d9d537f2e52bbf69120bf07805ac49c
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
