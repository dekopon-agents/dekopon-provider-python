name: Release v0.1.0

on:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROVIDER_RUST_TOOLCHAIN: "1.97.0"
  PROVIDER_MSRV: "1.93.0"
  WASM_TOOLS_VERSION: "1.236.1"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  DEKOPON_RUN_VERSION: "0.11.1"
  ORAS_VERSION: "1.2.3"
  ORAS_LINUX_AMD64_SHA256: "b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827"
  OCI_REPOSITORY: "ghcr.io/dekopon-agents/provider-python"
  SOURCE_OCI_REPOSITORY: "ghcr.io/dekopon-agents/provider-python-source"

jobs:
  build:
    name: verify immutable source, binary, and corresponding source
    if: github.repository == 'dekopon-agents/dekopon-provider-python' && vars.PROVIDER_PYTHON_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out immutable tag without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated tag, exact version, main ancestry, and compliance interlock
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = v0.1.0
          test -f RELEASE_COMPLIANCE.md
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "dekopon-python-provider") | .version')
          test "$version" = 0.1.0
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test -z "$(git ls-files '*.wasm')"
          grep -Fq 'owner has accepted the exact LGPL dependency constraint' RELEASE_COMPLIANCE.md
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Install pinned build, policy, host, and SBOM tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_MSRV" --profile minimal
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install cargo-deny \
            --version "$CARGO_DENY_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install cargo-cyclonedx \
            --version "$CARGO_CYCLONEDX_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install dekopon-run \
            --version "$DEKOPON_RUN_VERSION" --locked
      - name: Run complete source, component, host, policy, and measurement gates
        run: ./scripts/validate.sh
      - name: Check out independent tagged rebuild
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          path: rebuild
          persist-credentials: false
      - name: Rebuild independently and require generated input, core, and component identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t env_a < <(find \
            target/wasm32-unknown-unknown/release/build \
            -path '*/rustpython-vm-*/out/env_vars.rs' -type f -print)
          test "${#env_a[@]}" -eq 1
          cp "${env_a[0]}" "$RUNNER_TEMP/rustpython-env-a.rs"
          cp target/wasm32-unknown-unknown/release/dekopon_python_provider.wasm \
            "$RUNNER_TEMP/core-a.wasm"

          rm -rf /tmp/dekopon-python-provider-canonical/target
          (cd rebuild && ./scripts/build-component.sh)
          mapfile -t env_b < <(find \
            rebuild/target/wasm32-unknown-unknown/release/build \
            -path '*/rustpython-vm-*/out/env_vars.rs' -type f -print)
          test "${#env_b[@]}" -eq 1
          sha256sum "$RUNNER_TEMP/rustpython-env-a.rs" "${env_b[0]}" \
            "$RUNNER_TEMP/core-a.wasm" \
            rebuild/target/wasm32-unknown-unknown/release/dekopon_python_provider.wasm \
            python-provider.wasm rebuild/python-provider.wasm
          cmp "$RUNNER_TEMP/rustpython-env-a.rs" "${env_b[0]}"
          cmp "$RUNNER_TEMP/core-a.wasm" \
            rebuild/target/wasm32-unknown-unknown/release/dekopon_python_provider.wasm
          cmp python-provider.wasm rebuild/python-provider.wasm
          cmp python-provider.wasm.sha256 rebuild/python-provider.wasm.sha256
          sha256sum --check --strict python-provider.wasm.sha256
      - name: Build, reproduce, and offline-relink exact compliance assets
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/prepare-release-assets.sh 0.1.0 dist
          ./scripts/test-source-bundle-reproducibility.sh dist
          ./scripts/test-source-bundle-relink.sh \
            dist/dekopon-python-provider-0.1.0-relink-source.tar.gz \
            dist/dekopon-python-provider-0.1.0.cdx.json
          ./scripts/verify-release-assets.sh dist 0.1.0
      - name: Upload exact immutable release asset set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest component and corresponding source
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify checksums before attestation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 14
          (cd dist && sha256sum --check --strict python-provider.wasm.sha256)
          (cd dist && sha256sum --check --strict \
            dekopon-python-provider-0.1.0-relink-source.tar.gz.sha256)
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Attest all exact release subjects
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

  draft:
    name: create and verify run-owned exact draft release
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      marker: ${{ steps.create.outputs.marker }}
      provider_initial_visibility: ${{ steps.package_preflight.outputs.provider_initial_visibility }}
      source_initial_visibility: ${{ steps.package_preflight.outputs.source_initial_visibility }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Prove both authorized final package versions absent and record visibility
        id: package_preflight
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = 0.1.0
          inspect_package() {
            local package=$1 output_name=$2 visibility error versions
            error="$RUNNER_TEMP/$package-preflight.err"
            versions="$RUNNER_TEMP/$package-versions.jsons"
            if visibility=$(gh api "/orgs/dekopon-agents/packages/container/$package" \
              --jq .visibility 2>"$error"); then
              [[ "$visibility" == private || "$visibility" == public ]]
              gh api --paginate \
                "/orgs/dekopon-agents/packages/container/$package/versions?per_page=100" \
                >"$versions"
              jq -se --arg tag "$VERSION" \
                'all(.[][]; (((.metadata.container.tags // []) | index($tag)) == null))' \
                "$versions" >/dev/null || {
                echo "error: immutable OCI version already exists: $package:$VERSION" >&2
                return 1
              }
            elif grep -Eqi 'not found|404' "$error"; then
              visibility=absent
            else
              cat "$error" >&2
              return 1
            fi
            printf '%s=%s\n' "$output_name" "$visibility" >>"$GITHUB_OUTPUT"
          }
          inspect_package provider-python provider_initial_visibility
          inspect_package provider-python-source source_initial_visibility
      - name: Refuse an existing release and create a marked draft
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_INITIAL_VISIBILITY: ${{ steps.package_preflight.outputs.provider_initial_visibility }}
          SOURCE_INITIAL_VISIBILITY: ${{ steps.package_preflight.outputs.source_initial_visibility }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-release-assets.sh dist 0.1.0
          [[ "$PROVIDER_INITIAL_VISIBILITY" =~ ^(absent|private|public)$ ]]
          [[ "$SOURCE_INITIAL_VISIBILITY" =~ ^(absent|private|public)$ ]]
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            >"$RUNNER_TEMP/existing-release.json" 2>"$RUNNER_TEMP/existing-release.err"; then
            echo "error: release already exists for immutable tag $GITHUB_REF_NAME" >&2
            exit 1
          elif ! grep -Eqi 'not found|404' "$RUNNER_TEMP/existing-release.err"; then
            cat "$RUNNER_TEMP/existing-release.err" >&2
            exit 1
          fi
          marker="provider-python-run:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          release_id=
          find_owned_draft_id() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -ser --arg marker "$marker" '
                [.[][] | select(
                  .draft == true and .tag_name == "v0.1.0" and
                  (.body | startswith($marker))
                )] |
                if length == 1 then .[0].id
                elif length == 0 then empty
                else error("multiple run-owned drafts")
                end
              '
          }
          cleanup_created_draft() {
            if [[ -z "$release_id" ]]; then
              release_id=$(find_owned_draft_id 2>/dev/null || true)
            fi
            if [[ -n "$release_id" ]] && gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              >"$RUNNER_TEMP/failed-draft.json" 2>/dev/null &&
              jq -e --arg marker "$marker" \
                '.draft == true and (.body | startswith($marker))' \
                "$RUNNER_TEMP/failed-draft.json" >/dev/null; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" || true
            fi
          }
          handle_draft_error() {
            local status=$?
            trap - ERR INT TERM
            cleanup_created_draft
            exit "$status"
          }
          handle_draft_signal() {
            local status=$1
            trap - ERR INT TERM
            cleanup_created_draft
            exit "$status"
          }
          trap handle_draft_error ERR
          trap 'handle_draft_signal 130' INT
          trap 'handle_draft_signal 143' TERM
          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          $marker
          provider-python-initial-visibility:$PROVIDER_INITIAL_VISIBILITY
          provider-python-source-initial-visibility:$SOURCE_INITIAL_VISIBILITY

          IMPORTANT: python-provider.wasm embeds LGPL-3.0-only Malachite 0.9.2. Exact corresponding
          source, relinking instructions, notices, GNU license texts, checksums, and CycloneDX SBOM
          are attached and are also available at
          ghcr.io/dekopon-agents/provider-python-source:0.1.0. No latest tag is published.
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*
          for _ in {1..20}; do
            if release_id=$(find_owned_draft_id 2>/dev/null) && [[ -n "$release_id" ]]; then
              break
            fi
            sleep 2
          done
          test -n "$release_id"
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "marker=$marker" >>"$GITHUB_OUTPUT"
          trap - ERR INT TERM
      - name: Redownload every draft asset by ID and compare bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          MARKER: ${{ steps.create.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/release.json"
          jq -e --arg marker "$MARKER" \
            '.draft == true and .tag_name == "v0.1.0" and (.body | startswith($marker))' \
            "$RUNNER_TEMP/release.json" >/dev/null
          expected=$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          assets=$(jq -r '[.assets[].name] | sort | join("\n")' "$RUNNER_TEMP/release.json")
          test "$assets" = "$expected"
          mkdir "$RUNNER_TEMP/redownload"
          while IFS= read -r name; do
            asset_id=$(jq -er --arg name "$name" \
              '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else error("asset cardinality") end' \
              "$RUNNER_TEMP/release.json")
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"$RUNNER_TEMP/redownload/$name"
            cmp "dist/$name" "$RUNNER_TEMP/redownload/$name"
          done <<<"$expected"
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/redownload" 0.1.0

  ghcr:
    name: publish final source first, then one-layer provider, and verify anonymously
    needs: [build, draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      provider_manifest_digest: ${{ steps.publish.outputs.provider_manifest_digest }}
      source_manifest_digest: ${{ steps.publish.outputs.source_manifest_digest }}
    steps:
      - name: Check out manifest verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify exact release assets
        run: ./scripts/verify-release-assets.sh dist 0.1.0
      - name: Authenticate to GHCR with the job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned ORAS from verified archive
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          install -m 0755 "$RUNNER_TEMP/oras" "$RUNNER_TEMP/oras-bin"
      - name: Push only final refs in fail-closed source-before-provider order
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PROVIDER_INITIAL_VISIBILITY: ${{ needs.draft.outputs.provider_initial_visibility }}
          SOURCE_INITIAL_VISIBILITY: ${{ needs.draft.outputs.source_initial_visibility }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = 0.1.0
          [[ "$PROVIDER_INITIAL_VISIBILITY" =~ ^(absent|private|public)$ ]]
          [[ "$SOURCE_INITIAL_VISIBILITY" =~ ^(absent|private|public)$ ]]
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          provider_ref="$OCI_REPOSITORY:$VERSION"
          source_ref="$SOURCE_OCI_REPOSITORY:$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            >"$RUNNER_TEMP/transaction-draft.json"
          jq -e --arg marker "$MARKER" \
            --arg provider "provider-python-initial-visibility:$PROVIDER_INITIAL_VISIBILITY" \
            --arg source "provider-python-source-initial-visibility:$SOURCE_INITIAL_VISIBILITY" \
            '.draft == true and .tag_name == "v0.1.0" and
             (.body | startswith($marker)) and
             ((.body | split("\n")) | index($provider) != null and index($source) != null)' \
            "$RUNNER_TEMP/transaction-draft.json" >/dev/null

          assert_absent() {
            local ref=$1 label=$2 error="$RUNNER_TEMP/$2-absent.err"
            if "$RUNNER_TEMP/oras-bin" manifest fetch --descriptor "$ref" \
              >"$RUNNER_TEMP/$label-existing.json" 2>"$error"; then
              echo "error: immutable OCI version already exists: $ref" >&2
              return 1
            fi
            grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' "$error" || {
              cat "$error" >&2
              return 1
            }
          }
          package_visibility() {
            local package=$1 error=$2 visibility
            if visibility=$(gh api "/orgs/dekopon-agents/packages/container/$package" \
              --jq .visibility 2>"$error"); then
              [[ "$visibility" == private || "$visibility" == public ]]
              printf '%s\n' "$visibility"
            elif grep -Eqi 'not found|404' "$error"; then
              printf 'absent\n'
            else
              cat "$error" >&2
              return 1
            fi
          }
          set_package_visibility() {
            local package=$1 target=$2
            for _ in {1..10}; do
              if gh api --method PUT \
                "/orgs/dekopon-agents/packages/container/$package/visibility" \
                -f "visibility=$target" >/dev/null 2>"$RUNNER_TEMP/$package-set-visibility.err" &&
                [[ "$(package_visibility "$package" \
                  "$RUNNER_TEMP/$package-check-visibility.err")" == "$target" ]]; then
                return 0
              fi
              sleep 2
            done
            cat "$RUNNER_TEMP/$package-set-visibility.err" >&2 || true
            echo "error: could not set $package visibility to $target" >&2
            return 1
          }
          prepare_private_package() {
            local package=$1 initial=$2 current
            current=$(package_visibility "$package" "$RUNNER_TEMP/$package-current.err")
            test "$current" = "$initial"
            if [[ "$current" == public ]]; then
              set_package_visibility "$package" private
            fi
          }

          # Prove both immutable version tags absent before the first package mutation.
          assert_absent "$provider_ref" provider-version
          assert_absent "$source_ref" source-version

          # The corresponding-source final ref is the first manifest effect. Keep an existing
          # package private until its exact run-owned manifest and digest have been authenticated.
          prepare_private_package provider-python-source "$SOURCE_INITIAL_VISIBILITY"
          archive=dekopon-python-provider-0.1.0-relink-source.tar.gz
          archive_sha=$(sha256sum "dist/$archive" | awk '{print $1}')
          (
            cd dist
            "$RUNNER_TEMP/oras-bin" push "$source_ref" \
              --artifact-type application/vnd.dekopon.provider.source.v1 \
              --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.version=$VERSION" \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "org.opencontainers.image.licenses=LGPL-3.0-only" \
              --annotation "org.dekopon.release.run=$run" \
              --annotation "org.dekopon.release.url=https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
              --annotation "org.dekopon.provider.oci=$OCI_REPOSITORY:$VERSION" \
              --annotation "org.dekopon.corresponding-source.archive=$archive" \
              --annotation "org.dekopon.corresponding-source.sha256=$archive_sha" \
              --annotation "org.dekopon.distribution.notice=complete corresponding source and relink materials for LGPL-covered provider" \
              python-provider.wasm.sha256:text/plain \
              "$archive":application/gzip \
              "$archive.sha256":text/plain \
              dekopon-python-provider-0.1.0.cdx.json:application/vnd.cyclonedx+json \
              THIRD_PARTY_NOTICES.md:text/markdown \
              RELEASE_COMPLIANCE.md:text/markdown \
              RELINKING.md:text/markdown \
              LICENSE-MIT:text/plain \
              LICENSE-APACHE:text/plain \
              LICENSE-LGPL-2.1:text/plain \
              LICENSE-LGPL-3.0:text/plain \
              LICENSE-GPL-3.0:text/plain \
              SHA256SUMS:text/plain
          )
          source_digest=$("$RUNNER_TEMP/oras-bin" manifest fetch --descriptor \
            "$source_ref" | jq -er .digest)
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "source_manifest_digest=$source_digest" >>"$GITHUB_OUTPUT"
          "$RUNNER_TEMP/oras-bin" manifest fetch \
            "$SOURCE_OCI_REPOSITORY@$source_digest" >"$RUNNER_TEMP/source-manifest.json"
          ./scripts/verify-oci-manifest.py source "$RUNNER_TEMP/source-manifest.json" \
            dist "$run" "$GITHUB_SHA"
          set_package_visibility provider-python-source public

          # The source package must already be independently accessible and byte-exact without any
          # credential before the provider package is changed or its final manifest is pushed.
          docker logout ghcr.io
          mkdir "$RUNNER_TEMP/anonymous-source-before-provider"
          test "$(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch \
            --descriptor "$source_ref" | jq -er .digest)" = "$source_digest"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch "$source_ref" \
            >"$RUNNER_TEMP/anonymous-source-before-provider.json"
          ./scripts/verify-oci-manifest.py source \
            "$RUNNER_TEMP/anonymous-source-before-provider.json" dist "$run" "$GITHUB_SHA"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" pull "$source_ref" \
            --output "$RUNNER_TEMP/anonymous-source-before-provider"
          cp dist/python-provider.wasm "$RUNNER_TEMP/anonymous-source-before-provider/"
          ./scripts/verify-release-assets.sh \
            "$RUNNER_TEMP/anonymous-source-before-provider" 0.1.0
          expected=$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          while IFS= read -r name; do
            [[ "$name" == python-provider.wasm ]] && continue
            cmp "dist/$name" "$RUNNER_TEMP/anonymous-source-before-provider/$name"
          done <<<"$expected"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" \
            --password-stdin >/dev/null
          test "$(package_visibility provider-python-source \
            "$RUNNER_TEMP/source-public.err")" = public
          test "$("$RUNNER_TEMP/oras-bin" manifest fetch --descriptor "$source_ref" |
            jq -er .digest)" = "$source_digest"

          # Recheck the provider final tag after the source checks, then make any existing provider
          # package private so its sole new version cannot be exposed before manifest validation.
          assert_absent "$provider_ref" provider-before-push
          prepare_private_package provider-python "$PROVIDER_INITIAL_VISIBILITY"
          (
            cd dist
            "$RUNNER_TEMP/oras-bin" push "$provider_ref" \
              --artifact-type application/vnd.dekopon.provider.v1+wasm \
              --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.version=$VERSION" \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "org.opencontainers.image.licenses=LGPL-3.0-only" \
              --annotation "org.dekopon.release.run=$run" \
              --annotation "org.dekopon.release.url=https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
              --annotation "org.dekopon.corresponding-source.archive=$archive" \
              --annotation "org.dekopon.corresponding-source.oci=$SOURCE_OCI_REPOSITORY:$VERSION" \
              --annotation "org.dekopon.corresponding-source.digest=$source_digest" \
              --annotation "org.dekopon.distribution.notice=combined Wasm embeds LGPL-3.0-only Malachite 0.9.2; see THIRD_PARTY_NOTICES.md" \
              python-provider.wasm:application/wasm
          )
          provider_digest=$("$RUNNER_TEMP/oras-bin" manifest fetch --descriptor \
            "$provider_ref" | jq -er .digest)
          [[ "$provider_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "provider_manifest_digest=$provider_digest" >>"$GITHUB_OUTPUT"
          "$RUNNER_TEMP/oras-bin" manifest fetch \
            "$OCI_REPOSITORY@$provider_digest" >"$RUNNER_TEMP/provider-manifest.json"
          ./scripts/verify-oci-manifest.py provider "$RUNNER_TEMP/provider-manifest.json" \
            dist "$run" "$GITHUB_SHA" "$source_digest"
          set_package_visibility provider-python public

          docker logout ghcr.io
          mkdir "$RUNNER_TEMP/anonymous-provider" "$RUNNER_TEMP/anonymous-source"
          test "$(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch \
            --descriptor "$source_ref" | jq -er .digest)" = "$source_digest"
          test "$(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch \
            --descriptor "$provider_ref" | jq -er .digest)" = "$provider_digest"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch "$source_ref" \
            >"$RUNNER_TEMP/anonymous-source.json"
          ./scripts/verify-oci-manifest.py source "$RUNNER_TEMP/anonymous-source.json" \
            dist "$run" "$GITHUB_SHA"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch "$provider_ref" \
            >"$RUNNER_TEMP/anonymous-provider.json"
          ./scripts/verify-oci-manifest.py provider "$RUNNER_TEMP/anonymous-provider.json" \
            dist "$run" "$GITHUB_SHA" "$source_digest"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" pull "$source_ref" \
            --output "$RUNNER_TEMP/anonymous-source"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" pull "$provider_ref" \
            --output "$RUNNER_TEMP/anonymous-provider"
          test "$(find "$RUNNER_TEMP/anonymous-provider" -maxdepth 1 -type f | wc -l)" -eq 1
          cp "$RUNNER_TEMP/anonymous-provider/python-provider.wasm" \
            "$RUNNER_TEMP/anonymous-source/python-provider.wasm"
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/anonymous-source" 0.1.0
          while IFS= read -r name; do
            cmp "dist/$name" "$RUNNER_TEMP/anonymous-source/$name"
          done <<<"$expected"

  finalize:
    name: verify public final artifacts, then finalize the run-owned draft
    needs: [build, draft, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify exact assets and install pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-release-assets.sh dist 0.1.0
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          install -m 0755 "$RUNNER_TEMP/oras" "$RUNNER_TEMP/oras-bin"
      - name: Recheck every anonymous OCI byte before publishing the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
          PROVIDER_DIGEST: ${{ needs.ghcr.outputs.provider_manifest_digest }}
          SOURCE_DIGEST: ${{ needs.ghcr.outputs.source_manifest_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = 0.1.0
          [[ "$PROVIDER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          provider_ref="$OCI_REPOSITORY:$VERSION"
          source_ref="$SOURCE_OCI_REPOSITORY:$VERSION"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/draft.json"
          jq -e --arg marker "$MARKER" \
            '.draft == true and .tag_name == "v0.1.0" and (.body | startswith($marker))' \
            "$RUNNER_TEMP/draft.json" >/dev/null
          expected=$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          assets=$(jq -r '[.assets[].name] | sort | join("\n")' "$RUNNER_TEMP/draft.json")
          test "$assets" = "$expected"

          test "$(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch \
            --descriptor "$source_ref" | jq -er .digest)" = "$SOURCE_DIGEST"
          test "$(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch \
            --descriptor "$provider_ref" | jq -er .digest)" = "$PROVIDER_DIGEST"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch "$source_ref" \
            >"$RUNNER_TEMP/final-source.json"
          ./scripts/verify-oci-manifest.py source "$RUNNER_TEMP/final-source.json" \
            dist "$run" "$GITHUB_SHA"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch "$provider_ref" \
            >"$RUNNER_TEMP/final-provider.json"
          ./scripts/verify-oci-manifest.py provider "$RUNNER_TEMP/final-provider.json" \
            dist "$run" "$GITHUB_SHA" "$SOURCE_DIGEST"
          mkdir "$RUNNER_TEMP/final-source" "$RUNNER_TEMP/final-provider"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" pull "$source_ref" \
            --output "$RUNNER_TEMP/final-source"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" pull "$provider_ref" \
            --output "$RUNNER_TEMP/final-provider"
          test "$(find "$RUNNER_TEMP/final-provider" -maxdepth 1 -type f | wc -l)" -eq 1
          cp "$RUNNER_TEMP/final-provider/python-provider.wasm" \
            "$RUNNER_TEMP/final-source/python-provider.wasm"
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/final-source" 0.1.0
          while IFS= read -r name; do
            cmp "dist/$name" "$RUNNER_TEMP/final-source/$name"
          done <<<"$expected"

          # Re-resolve the still-owned draft immediately before finalization and compare every
          # asset by ID so no release-side mutation can slip between the earlier draft check and
          # the final publication decision.
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            >"$RUNNER_TEMP/final-draft.json"
          jq -e --arg marker "$MARKER" \
            '.draft == true and .tag_name == "v0.1.0" and (.body | startswith($marker))' \
            "$RUNNER_TEMP/final-draft.json" >/dev/null
          final_assets=$(jq -r '[.assets[].name] | sort | join("\n")' \
            "$RUNNER_TEMP/final-draft.json")
          test "$final_assets" = "$expected"
          mkdir "$RUNNER_TEMP/final-draft-assets"
          while IFS= read -r name; do
            asset_id=$(jq -er --arg name "$name" \
              '[.assets[] | select(.name == $name)] |
               if length == 1 then .[0].id else error("asset cardinality") end' \
              "$RUNNER_TEMP/final-draft.json")
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"$RUNNER_TEMP/final-draft-assets/$name"
            cmp "dist/$name" "$RUNNER_TEMP/final-draft-assets/$name"
          done <<<"$expected"
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/final-draft-assets" 0.1.0

          # This PATCH is the transaction's final mutation. Any later check is read-only, and a
          # failure after this point must preserve the immutable release and its linked artifacts.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false >"$RUNNER_TEMP/published.json"
          jq -e --arg marker "$MARKER" \
            '.draft == false and .tag_name == "v0.1.0" and (.body | startswith($marker))' \
            "$RUNNER_TEMP/published.json" >/dev/null

  post_release:
    name: independent read-only anonymous release and dual-OCI verification
    needs: [build, draft, finalize, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Pull every public byte without credentials and compare linked digests
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PROVIDER_DIGEST: ${{ needs.ghcr.outputs.provider_manifest_digest }}
          SOURCE_DIGEST: ${{ needs.ghcr.outputs.source_manifest_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = 0.1.0
          [[ "$PROVIDER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          mkdir release provider source
          for name in \
            python-provider.wasm \
            python-provider.wasm.sha256 \
            dekopon-python-provider-0.1.0-relink-source.tar.gz \
            dekopon-python-provider-0.1.0-relink-source.tar.gz.sha256 \
            dekopon-python-provider-0.1.0.cdx.json \
            THIRD_PARTY_NOTICES.md RELEASE_COMPLIANCE.md RELINKING.md \
            LICENSE-MIT LICENSE-APACHE LICENSE-LGPL-2.1 LICENSE-LGPL-3.0 LICENSE-GPL-3.0 \
            SHA256SUMS; do
            curl --fail --silent --show-error --location \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$name" \
              --output "release/$name"
          done
          test "$(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras" manifest fetch \
            --descriptor "$OCI_REPOSITORY:$VERSION" | jq -er .digest)" = "$PROVIDER_DIGEST"
          test "$(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras" manifest fetch \
            --descriptor "$SOURCE_OCI_REPOSITORY:$VERSION" | jq -er .digest)" = "$SOURCE_DIGEST"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras" manifest fetch \
            "$SOURCE_OCI_REPOSITORY:$VERSION" >source-manifest.json
          ./scripts/verify-oci-manifest.py source source-manifest.json \
            release "$run" "$GITHUB_SHA"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras" manifest fetch \
            "$OCI_REPOSITORY:$VERSION" >provider-manifest.json
          ./scripts/verify-oci-manifest.py provider provider-manifest.json \
            release "$run" "$GITHUB_SHA" "$SOURCE_DIGEST"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras" pull \
            "$OCI_REPOSITORY:$VERSION" --output provider
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras" pull \
            "$SOURCE_OCI_REPOSITORY:$VERSION" --output source
          test "$(find provider -maxdepth 1 -type f | wc -l)" -eq 1
          cp provider/python-provider.wasm source/python-provider.wasm
          ./scripts/verify-release-assets.sh release 0.1.0
          ./scripts/verify-release-assets.sh source 0.1.0
          diff -qr release source

  cleanup_failed_release:
    name: remove only this run's draft and verified final OCI effects
    if: ${{ always() && needs.finalize.result != 'success' }}
    needs: [build, draft, ghcr, finalize, post_release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Install pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Authenticate to GHCR with the job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact ownership, then remove provider before source and the draft last
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
          PROVIDER_DIGEST: ${{ needs.ghcr.outputs.provider_manifest_digest }}
          SOURCE_DIGEST: ${{ needs.ghcr.outputs.source_manifest_digest }}
          PROVIDER_INITIAL_VISIBILITY: ${{ needs.draft.outputs.provider_initial_visibility }}
          SOURCE_INITIAL_VISIBILITY: ${{ needs.draft.outputs.source_initial_visibility }}
          OCI_JOB_RESULT: ${{ needs.ghcr.result }}
        shell: bash
        run: |
          set -euo pipefail
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          expected_marker="provider-python-run:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          [[ -z "$MARKER" || "$MARKER" == "$expected_marker" ]]
          [[ -z "$PROVIDER_DIGEST" || "$PROVIDER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -z "$SOURCE_DIGEST" || "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          # Resolve only the deterministic release ID/tag and require this run's marker. A published
          # owned release proves finalization happened, so all subsequent state is immutable.
          release_found=false
          release_owned=false
          release_owned_draft=false
          release_id=$RELEASE_ID
          if [[ -n "$release_id" ]]; then
            [[ "$release_id" =~ ^[0-9]+$ ]]
            release_endpoint="repos/$GITHUB_REPOSITORY/releases/$release_id"
          else
            release_endpoint="repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0"
          fi
          if gh api "$release_endpoint" \
            >"$RUNNER_TEMP/release.json" 2>"$RUNNER_TEMP/release.err"; then
            release_found=true
            if jq -e --arg marker "$expected_marker" \
              '.tag_name == "v0.1.0" and ((.body // "") | startswith($marker))' \
              "$RUNNER_TEMP/release.json" >/dev/null; then
              release_owned=true
              release_id=$(jq -er .id "$RUNNER_TEMP/release.json")
              [[ "$release_id" =~ ^[0-9]+$ ]]
              if jq -e '.draft == false' "$RUNNER_TEMP/release.json" >/dev/null; then
                echo 'preserving immutable finalized release after read-only failure' >&2
                exit 0
              fi
              jq -e '.draft == true' "$RUNNER_TEMP/release.json" >/dev/null
              release_owned_draft=true
            else
              echo 'preserving release not owned by this run' >&2
            fi
          elif ! grep -Eqi 'not found|404' "$RUNNER_TEMP/release.err"; then
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi

          extract_recorded_visibility() {
            local prefix=$1
            jq -er --arg prefix "$prefix:" \
              '[((.body // "") | split("\n")[]) |
                select(startswith($prefix)) | ltrimstr($prefix)] |
               if length == 1 then .[0] else error("visibility marker cardinality") end' \
              "$RUNNER_TEMP/release.json"
          }
          if [[ "$release_owned" == true ]]; then
            recorded_provider=$(extract_recorded_visibility provider-python-initial-visibility)
            recorded_source=$(extract_recorded_visibility provider-python-source-initial-visibility)
            [[ "$recorded_provider" =~ ^(absent|private|public)$ ]]
            [[ "$recorded_source" =~ ^(absent|private|public)$ ]]
            [[ -z "$PROVIDER_INITIAL_VISIBILITY" ||
              "$PROVIDER_INITIAL_VISIBILITY" == "$recorded_provider" ]]
            [[ -z "$SOURCE_INITIAL_VISIBILITY" ||
              "$SOURCE_INITIAL_VISIBILITY" == "$recorded_source" ]]
            PROVIDER_INITIAL_VISIBILITY=$recorded_provider
            SOURCE_INITIAL_VISIBILITY=$recorded_source
          fi

          provider_record="$RUNNER_TEMP/provider-record"
          source_record="$RUNNER_TEMP/source-record"
          : >"$provider_record"
          : >"$source_record"
          record_owned_final_manifest() {
            local repository=$1 reference=$2 expected_digest=$3 output=$4 label=$5
            local descriptor digest
            if ! descriptor=$("$RUNNER_TEMP/oras" manifest fetch --descriptor "$reference" \
              2>"$RUNNER_TEMP/$label.err"); then
              if grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
                "$RUNNER_TEMP/$label.err"; then
                return 0
              fi
              cat "$RUNNER_TEMP/$label.err" >&2
              return 1
            fi
            digest=$(jq -er .digest <<<"$descriptor")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            if [[ -n "$expected_digest" ]]; then
              test "$digest" = "$expected_digest"
            fi
            "$RUNNER_TEMP/oras" manifest fetch "$repository@$digest" \
              >"$RUNNER_TEMP/$label.json"
            jq -e --arg run "$run" \
              '.annotations["org.dekopon.release.run"] == $run and
               .annotations["org.opencontainers.image.source"] ==
                 "https://github.com/dekopon-agents/dekopon-provider-python" and
               .annotations["org.opencontainers.image.licenses"] == "LGPL-3.0-only" and
               .annotations["org.opencontainers.image.version"] == "0.1.0"' \
              "$RUNNER_TEMP/$label.json" >/dev/null
            printf '%s\n' "$digest" >"$output"
          }
          record_owned_final_manifest "$OCI_REPOSITORY" "$OCI_REPOSITORY:0.1.0" \
            "$PROVIDER_DIGEST" "$provider_record" provider-final
          record_owned_final_manifest "$SOURCE_OCI_REPOSITORY" \
            "$SOURCE_OCI_REPOSITORY:0.1.0" "$SOURCE_DIGEST" "$source_record" source-final

          if [[ -z "$PROVIDER_INITIAL_VISIBILITY" || -z "$SOURCE_INITIAL_VISIBILITY" ]]; then
            if [[ ! -s "$provider_record" && ! -s "$source_record" &&
              "$release_found" == false && "$OCI_JOB_RESULT" == skipped ]]; then
              exit 0
            fi
            echo 'error: refusing cleanup without recorded prior package visibility' >&2
            exit 1
          fi
          [[ "$PROVIDER_INITIAL_VISIBILITY" =~ ^(absent|private|public)$ ]]
          [[ "$SOURCE_INITIAL_VISIBILITY" =~ ^(absent|private|public)$ ]]

          assert_manifest_has_only_final_tag() {
            local package=$1 digest=$2 versions="$RUNNER_TEMP/$1-cleanup-versions.jsons"
            gh api --paginate \
              "/orgs/dekopon-agents/packages/container/$package/versions?per_page=100" \
              >"$versions"
            jq -se --arg digest "$digest" --arg tag 0.1.0 \
              '[.[][] | select(.name == $digest)] as $matches |
               ($matches | length) == 1 and
               (($matches[0].metadata.container.tags // []) | sort) == [$tag]' \
              "$versions" >/dev/null || {
              echo "error: refusing to delete missing or shared manifest $package@$digest" >&2
              return 1
            }
          }
          assert_ref_absent() {
            local ref=$1 label=$2
            if "$RUNNER_TEMP/oras" manifest fetch --descriptor "$ref" \
              >/dev/null 2>"$RUNNER_TEMP/$label-delete-check.err"; then
              echo "error: final ref survived cleanup: $ref" >&2
              return 1
            fi
            grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
              "$RUNNER_TEMP/$label-delete-check.err"
          }
          delete_owned_manifest() {
            local package=$1 repository=$2 reference=$3 record=$4 label=$5 digest
            [[ -s "$record" ]] || return 0
            digest=$(<"$record")
            assert_manifest_has_only_final_tag "$package" "$digest"
            "$RUNNER_TEMP/oras" manifest delete --force "$repository@$digest"
            assert_ref_absent "$reference" "$label"
          }
          current_visibility() {
            local package=$1 error=$2 visibility
            if visibility=$(gh api "/orgs/dekopon-agents/packages/container/$package" \
              --jq .visibility 2>"$error"); then
              [[ "$visibility" == private || "$visibility" == public ]]
              printf '%s\n' "$visibility"
            elif grep -Eqi 'not found|404' "$error"; then
              printf 'absent\n'
            else
              cat "$error" >&2
              return 1
            fi
          }
          put_visibility() {
            local package=$1 target=$2
            for _ in {1..10}; do
              if gh api --method PUT \
                "/orgs/dekopon-agents/packages/container/$package/visibility" \
                -f "visibility=$target" >/dev/null 2>"$RUNNER_TEMP/$package-restore.err" &&
                [[ "$(current_visibility "$package" \
                  "$RUNNER_TEMP/$package-restored.err")" == "$target" ]]; then
                return 0
              fi
              sleep 2
            done
            cat "$RUNNER_TEMP/$package-restore.err" >&2 || true
            return 1
          }
          restore_visibility() {
            local package=$1 initial=$2 current versions
            current=$(current_visibility "$package" "$RUNNER_TEMP/$package-current.err")
            [[ "$current" == absent ]] && return 0
            if [[ "$initial" == absent ]]; then
              versions="$RUNNER_TEMP/$package-remaining-versions.jsons"
              gh api --paginate \
                "/orgs/dekopon-agents/packages/container/$package/versions?per_page=100" \
                >"$versions"
              jq -se '([.[][]] | length) == 0' "$versions" >/dev/null || {
                echo "error: refusing to change visibility of newly unrelated $package versions" >&2
                return 1
              }
              initial=private
            fi
            if [[ "$current" != "$initial" ]]; then
              put_visibility "$package" "$initial"
            fi
          }

          # Never remove source while a run-owned provider survives. No other tag is created for
          # either digest, and package metadata must prove the manifest is not shared before DELETE.
          delete_owned_manifest provider-python "$OCI_REPOSITORY" \
            "$OCI_REPOSITORY:0.1.0" "$provider_record" provider-final
          restore_visibility provider-python "$PROVIDER_INITIAL_VISIBILITY"
          delete_owned_manifest provider-python-source "$SOURCE_OCI_REPOSITORY" \
            "$SOURCE_OCI_REPOSITORY:0.1.0" "$source_record" source-final
          restore_visibility provider-python-source "$SOURCE_INITIAL_VISIBILITY"

          if [[ "$release_owned_draft" == true ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          fi
