name: Release v0.1.0

on:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROVIDER_RUST_TOOLCHAIN: "1.97.0"
  PROVIDER_MSRV: "1.93.0"
  WASM_TOOLS_VERSION: "1.236.1"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  DEKOPON_RUN_VERSION: "0.11.1"
  ORAS_VERSION: "1.2.3"
  ORAS_LINUX_AMD64_SHA256: "b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827"
  OCI_REPOSITORY: "ghcr.io/dekopon-agents/provider-python"
  OCI_STAGING_REPOSITORY: "ghcr.io/dekopon-agents/provider-python-staging"
  SOURCE_OCI_REPOSITORY: "ghcr.io/dekopon-agents/provider-python-source"
  SOURCE_OCI_STAGING_REPOSITORY: "ghcr.io/dekopon-agents/provider-python-source-staging"

jobs:
  build:
    name: verify immutable source, binary, and corresponding source
    if: github.repository == 'dekopon-agents/dekopon-provider-python' && vars.PROVIDER_PYTHON_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out immutable tag without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated tag, exact version, main ancestry, and compliance interlock
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = v0.1.0
          test -f RELEASE_COMPLIANCE.md
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "dekopon-python-provider") | .version')
          test "$version" = 0.1.0
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test -z "$(git ls-files '*.wasm')"
          grep -Fq 'owner has accepted the exact LGPL dependency constraint' RELEASE_COMPLIANCE.md
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Install pinned build, policy, host, and SBOM tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_MSRV" --profile minimal
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install cargo-deny \
            --version "$CARGO_DENY_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install cargo-cyclonedx \
            --version "$CARGO_CYCLONEDX_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install dekopon-run \
            --version "$DEKOPON_RUN_VERSION" --locked
      - name: Run complete source, component, host, policy, and measurement gates
        run: ./scripts/validate.sh
      - name: Check out independent tagged rebuild
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          path: rebuild
          persist-credentials: false
      - name: Rebuild independently and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dekopon-python-provider-canonical/target
          (cd rebuild && ./scripts/build-component.sh)
          cmp python-provider.wasm rebuild/python-provider.wasm
          cmp python-provider.wasm.sha256 rebuild/python-provider.wasm.sha256
          sha256sum --check --strict python-provider.wasm.sha256
      - name: Build, reproduce, and offline-relink exact compliance assets
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/prepare-release-assets.sh 0.1.0 dist
          ./scripts/test-source-bundle-reproducibility.sh dist
          ./scripts/test-source-bundle-relink.sh \
            dist/dekopon-python-provider-0.1.0-relink-source.tar.gz \
            dist/dekopon-python-provider-0.1.0.cdx.json
          ./scripts/verify-release-assets.sh dist 0.1.0
      - name: Upload exact immutable release asset set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest component and corresponding source
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify checksums before attestation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 14
          (cd dist && sha256sum --check --strict python-provider.wasm.sha256)
          (cd dist && sha256sum --check --strict \
            dekopon-python-provider-0.1.0-relink-source.tar.gz.sha256)
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Attest all exact release subjects
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

  draft:
    name: create and verify run-owned exact draft release
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      marker: ${{ steps.create.outputs.marker }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Refuse an existing release and create a marked draft
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-release-assets.sh dist 0.1.0
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "error: release already exists for immutable tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          marker="provider-python-run:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          release_id=
          cleanup_created_draft() {
            if [[ -z "$release_id" ]]; then
              release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                --jq .id 2>/dev/null || true)
            fi
            if [[ -n "$release_id" ]] && gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              >"$RUNNER_TEMP/failed-draft.json" 2>/dev/null; then
              jq -e --arg marker "$marker" \
                '.draft == true and (.body | startswith($marker))' \
                "$RUNNER_TEMP/failed-draft.json" >/dev/null
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            fi
          }
          trap cleanup_created_draft ERR
          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          $marker

          IMPORTANT: python-provider.wasm embeds LGPL-3.0-only Malachite 0.9.2. Exact corresponding
          source, relinking instructions, notices, GNU license texts, checksums, and CycloneDX SBOM
          are attached and are also available at
          ghcr.io/dekopon-agents/provider-python-source:0.1.0. No latest tag is published.
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          test -n "$release_id"
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "marker=$marker" >>"$GITHUB_OUTPUT"
          trap - ERR
      - name: Redownload every draft asset by ID and compare bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          MARKER: ${{ steps.create.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/release.json"
          jq -e --arg marker "$MARKER" \
            '.draft == true and .tag_name == "v0.1.0" and (.body | startswith($marker))' \
            "$RUNNER_TEMP/release.json" >/dev/null
          expected=$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          assets=$(jq -r '[.assets[].name] | sort | join("\n")' "$RUNNER_TEMP/release.json")
          test "$assets" = "$expected"
          mkdir "$RUNNER_TEMP/redownload"
          while IFS= read -r name; do
            asset_id=$(jq -er --arg name "$name" \
              '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else error("asset cardinality") end' \
              "$RUNNER_TEMP/release.json")
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"$RUNNER_TEMP/redownload/$name"
            cmp "dist/$name" "$RUNNER_TEMP/redownload/$name"
          done <<<"$expected"
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/redownload" 0.1.0

  ghcr:
    name: stage run-owned provider and source manifests by digest
    needs: [build, draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      provider_manifest_digest: ${{ steps.publish.outputs.provider_manifest_digest }}
      source_manifest_digest: ${{ steps.publish.outputs.source_manifest_digest }}
      provider_staging_ref: ${{ steps.publish.outputs.provider_staging_ref }}
      source_staging_ref: ${{ steps.publish.outputs.source_staging_ref }}
      provider_initial_visibility: ${{ steps.publish.outputs.provider_initial_visibility }}
      source_initial_visibility: ${{ steps.publish.outputs.source_initial_visibility }}
    steps:
      - name: Check out manifest verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify exact release assets
        run: ./scripts/verify-release-assets.sh dist 0.1.0
      - name: Authenticate to GHCR with the job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned ORAS from verified archive
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          install -m 0755 "$RUNNER_TEMP/oras" "$RUNNER_TEMP/oras-bin"
      - name: Refuse immutable versions, stage source then one-layer provider, and verify
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = 0.1.0
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          provider_version_ref="$OCI_REPOSITORY:$VERSION"
          source_version_ref="$SOURCE_OCI_REPOSITORY:$VERSION"
          assert_absent() {
            local ref=$1 label=$2
            if "$RUNNER_TEMP/oras-bin" manifest fetch "$ref" \
              >"$RUNNER_TEMP/existing-$label.json" 2>"$RUNNER_TEMP/existing-$label.err"; then
              echo "error: immutable OCI version already exists: $ref" >&2
              exit 1
            fi
            grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
              "$RUNNER_TEMP/existing-$label.err" || {
              cat "$RUNNER_TEMP/existing-$label.err" >&2
              exit 1
            }
          }
          assert_absent "$provider_version_ref" provider-version
          assert_absent "$source_version_ref" source-version

          package_visibility() {
            local package=$1 error=$2
            if visibility=$(gh api "/orgs/dekopon-agents/packages/container/$package" --jq .visibility \
              2>"$error"); then
              test "$visibility" = private -o "$visibility" = public
              printf '%s\n' "$visibility"
            elif grep -Eqi 'not found|404' "$error"; then
              printf 'absent\n'
            else
              cat "$error" >&2
              return 1
            fi
          }
          provider_initial_visibility=$(package_visibility provider-python \
            "$RUNNER_TEMP/provider-visibility.err")
          source_initial_visibility=$(package_visibility provider-python-source \
            "$RUNNER_TEMP/source-visibility.err")

          staging_tag="run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          provider_staging_ref="$OCI_STAGING_REPOSITORY:$staging_tag"
          source_staging_ref="$SOURCE_OCI_STAGING_REPOSITORY:$staging_tag"
          assert_absent "$provider_staging_ref" provider-staging
          assert_absent "$source_staging_ref" source-staging

          provider_digest=
          source_digest=
          cleanup_staged_on_error() {
            for pair in \
              "$OCI_STAGING_REPOSITORY|$provider_digest" \
              "$SOURCE_OCI_STAGING_REPOSITORY|$source_digest"; do
              repository=${pair%%|*}
              digest=${pair#*|}
              [[ -n "$digest" ]] || continue
              if "$RUNNER_TEMP/oras-bin" manifest fetch "$repository@$digest" \
                >"$RUNNER_TEMP/cleanup-stage.json" 2>/dev/null &&
                jq -e --arg run "$run" '.annotations["org.dekopon.release.run"] == $run' \
                  "$RUNNER_TEMP/cleanup-stage.json" >/dev/null; then
                "$RUNNER_TEMP/oras-bin" manifest delete --force "$repository@$digest" || true
              fi
            done
          }
          trap cleanup_staged_on_error ERR

          archive=dekopon-python-provider-0.1.0-relink-source.tar.gz
          archive_sha=$(sha256sum "dist/$archive" | awk '{print $1}')
          (
            cd dist
            "$RUNNER_TEMP/oras-bin" push "$source_staging_ref" \
              --artifact-type application/vnd.dekopon.provider.source.v1 \
              --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.version=$VERSION" \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "org.dekopon.release.run=$run" \
              --annotation "org.dekopon.release.url=https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
              --annotation "org.dekopon.provider.oci=$OCI_REPOSITORY:$VERSION" \
              --annotation "org.dekopon.corresponding-source.archive=$archive" \
              --annotation "org.dekopon.corresponding-source.sha256=$archive_sha" \
              --annotation "org.dekopon.distribution.notice=complete corresponding source and relink materials for LGPL-covered provider" \
              python-provider.wasm.sha256:text/plain \
              "$archive":application/gzip \
              "$archive.sha256":text/plain \
              dekopon-python-provider-0.1.0.cdx.json:application/vnd.cyclonedx+json \
              THIRD_PARTY_NOTICES.md:text/markdown \
              RELEASE_COMPLIANCE.md:text/markdown \
              RELINKING.md:text/markdown \
              LICENSE-MIT:text/plain \
              LICENSE-APACHE:text/plain \
              LICENSE-LGPL-2.1:text/plain \
              LICENSE-LGPL-3.0:text/plain \
              LICENSE-GPL-3.0:text/plain \
              SHA256SUMS:text/plain
          )
          source_digest=$("$RUNNER_TEMP/oras-bin" manifest fetch --descriptor \
            "$source_staging_ref" | jq -er .digest)
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          "$RUNNER_TEMP/oras-bin" manifest fetch \
            "$SOURCE_OCI_STAGING_REPOSITORY@$source_digest" >"$RUNNER_TEMP/source-manifest.json"
          ./scripts/verify-oci-manifest.py source "$RUNNER_TEMP/source-manifest.json" \
            dist "$run" "$GITHUB_SHA"

          (
            cd dist
            "$RUNNER_TEMP/oras-bin" push "$provider_staging_ref" \
              --artifact-type application/vnd.dekopon.provider.v1+wasm \
              --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.version=$VERSION" \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "org.dekopon.release.run=$run" \
              --annotation "org.dekopon.release.url=https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
              --annotation "org.dekopon.corresponding-source.archive=$archive" \
              --annotation "org.dekopon.corresponding-source.oci=$SOURCE_OCI_REPOSITORY:$VERSION" \
              --annotation "org.dekopon.corresponding-source.digest=$source_digest" \
              --annotation "org.dekopon.distribution.notice=combined Wasm embeds LGPL-3.0-only Malachite 0.9.2; see THIRD_PARTY_NOTICES.md" \
              python-provider.wasm:application/wasm
          )
          provider_digest=$("$RUNNER_TEMP/oras-bin" manifest fetch --descriptor \
            "$provider_staging_ref" | jq -er .digest)
          [[ "$provider_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          "$RUNNER_TEMP/oras-bin" manifest fetch \
            "$OCI_STAGING_REPOSITORY@$provider_digest" >"$RUNNER_TEMP/provider-manifest.json"
          ./scripts/verify-oci-manifest.py provider "$RUNNER_TEMP/provider-manifest.json" \
            dist "$run" "$GITHUB_SHA" "$source_digest"

          for package in provider-python-staging provider-python-source-staging; do
            gh api --method PUT "/orgs/dekopon-agents/packages/container/$package/visibility" \
              -f visibility=private >/dev/null
            test "$(gh api "/orgs/dekopon-agents/packages/container/$package" --jq .visibility)" = private
          done
          {
            echo "provider_manifest_digest=$provider_digest"
            echo "source_manifest_digest=$source_digest"
            echo "provider_staging_ref=$provider_staging_ref"
            echo "source_staging_ref=$source_staging_ref"
            echo "provider_initial_visibility=$provider_initial_visibility"
            echo "source_initial_visibility=$source_initial_visibility"
          } >>"$GITHUB_OUTPUT"
          trap - ERR

  finalize:
    name: publish both OCI versions, verify anonymously, then publish exact release
    needs: [build, draft, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify exact assets and install pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-release-assets.sh dist 0.1.0
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          install -m 0755 "$RUNNER_TEMP/oras" "$RUNNER_TEMP/oras-bin"
      - name: Authenticate to GHCR with the job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish by staged digests and complete anonymous transaction checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
          PROVIDER_DIGEST: ${{ needs.ghcr.outputs.provider_manifest_digest }}
          SOURCE_DIGEST: ${{ needs.ghcr.outputs.source_manifest_digest }}
          PROVIDER_STAGING_REF: ${{ needs.ghcr.outputs.provider_staging_ref }}
          SOURCE_STAGING_REF: ${{ needs.ghcr.outputs.source_staging_ref }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          [[ "$PROVIDER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$PROVIDER_STAGING_REF" = "$OCI_STAGING_REPOSITORY:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$SOURCE_STAGING_REF" = "$SOURCE_OCI_STAGING_REPOSITORY:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$VERSION" = 0.1.0

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$RUNNER_TEMP/draft.json"
          jq -e --arg marker "$MARKER" \
            '.draft == true and .tag_name == "v0.1.0" and (.body | startswith($marker))' \
            "$RUNNER_TEMP/draft.json" >/dev/null
          expected=$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          assets=$(jq -r '[.assets[].name] | sort | join("\n")' "$RUNNER_TEMP/draft.json")
          test "$assets" = "$expected"

          "$RUNNER_TEMP/oras-bin" manifest fetch \
            "$SOURCE_OCI_STAGING_REPOSITORY@$SOURCE_DIGEST" >"$RUNNER_TEMP/staged-source.json"
          ./scripts/verify-oci-manifest.py source "$RUNNER_TEMP/staged-source.json" \
            dist "$run" "$GITHUB_SHA"
          "$RUNNER_TEMP/oras-bin" manifest fetch \
            "$OCI_STAGING_REPOSITORY@$PROVIDER_DIGEST" >"$RUNNER_TEMP/staged-provider.json"
          ./scripts/verify-oci-manifest.py provider "$RUNNER_TEMP/staged-provider.json" \
            dist "$run" "$GITHUB_SHA" "$SOURCE_DIGEST"

          provider_ref="$OCI_REPOSITORY:$VERSION"
          source_ref="$SOURCE_OCI_REPOSITORY:$VERSION"
          for ref in "$provider_ref" "$source_ref"; do
            if "$RUNNER_TEMP/oras-bin" manifest fetch "$ref" >/dev/null 2>"$RUNNER_TEMP/final-absent.err"; then
              echo "error: immutable OCI version appeared during release: $ref" >&2
              exit 1
            fi
            grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
              "$RUNNER_TEMP/final-absent.err"
          done

          "$RUNNER_TEMP/oras-bin" cp \
            "$SOURCE_OCI_STAGING_REPOSITORY@$SOURCE_DIGEST" "$source_ref"
          test "$("$RUNNER_TEMP/oras-bin" manifest fetch --descriptor "$source_ref" |
            jq -er .digest)" = "$SOURCE_DIGEST"
          "$RUNNER_TEMP/oras-bin" cp \
            "$OCI_STAGING_REPOSITORY@$PROVIDER_DIGEST" "$provider_ref"
          test "$("$RUNNER_TEMP/oras-bin" manifest fetch --descriptor "$provider_ref" |
            jq -er .digest)" = "$PROVIDER_DIGEST"

          "$RUNNER_TEMP/oras-bin" manifest delete --force \
            "$SOURCE_OCI_STAGING_REPOSITORY@$SOURCE_DIGEST"
          "$RUNNER_TEMP/oras-bin" manifest delete --force \
            "$OCI_STAGING_REPOSITORY@$PROVIDER_DIGEST"
          for package in provider-python provider-python-source; do
            gh api --method PUT "/orgs/dekopon-agents/packages/container/$package/visibility" \
              -f visibility=public >/dev/null
            test "$(gh api "/orgs/dekopon-agents/packages/container/$package" --jq .visibility)" = public
          done

          docker logout ghcr.io
          mkdir "$RUNNER_TEMP/anonymous-provider" "$RUNNER_TEMP/anonymous-source"
          test "$(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch \
            --descriptor "$provider_ref" | jq -er .digest)" = "$PROVIDER_DIGEST"
          test "$(env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" manifest fetch \
            --descriptor "$source_ref" | jq -er .digest)" = "$SOURCE_DIGEST"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" pull "$provider_ref" \
            --output "$RUNNER_TEMP/anonymous-provider"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/oras-bin" pull "$source_ref" \
            --output "$RUNNER_TEMP/anonymous-source"
          cp "$RUNNER_TEMP/anonymous-provider/python-provider.wasm" \
            "$RUNNER_TEMP/anonymous-source/python-provider.wasm"
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/anonymous-source" 0.1.0
          while IFS= read -r name; do
            cmp "dist/$name" "$RUNNER_TEMP/anonymous-source/$name"
          done <<<"$expected"

          # Publishing is delayed until both linked OCI artifacts and every compliance byte have
          # already passed anonymous pulls. A later failure is rolled back by the run-owned cleanup.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false >"$RUNNER_TEMP/published.json"
          test "$(jq -r .draft "$RUNNER_TEMP/published.json")" = false
          mkdir "$RUNNER_TEMP/anonymous-release"
          while IFS= read -r name; do
            curl --fail --silent --show-error --location \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$name" \
              --output "$RUNNER_TEMP/anonymous-release/$name"
            cmp "dist/$name" "$RUNNER_TEMP/anonymous-release/$name"
          done <<<"$expected"
          ./scripts/verify-release-assets.sh "$RUNNER_TEMP/anonymous-release" 0.1.0

  post_release:
    name: independent anonymous release and dual-OCI verification
    needs: [build, finalize, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out verification scripts without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Pull every public byte without credentials and compare linked digests
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PROVIDER_DIGEST: ${{ needs.ghcr.outputs.provider_manifest_digest }}
          SOURCE_DIGEST: ${{ needs.ghcr.outputs.source_manifest_digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release provider source
          for name in \
            python-provider.wasm \
            python-provider.wasm.sha256 \
            dekopon-python-provider-0.1.0-relink-source.tar.gz \
            dekopon-python-provider-0.1.0-relink-source.tar.gz.sha256 \
            dekopon-python-provider-0.1.0.cdx.json \
            THIRD_PARTY_NOTICES.md RELEASE_COMPLIANCE.md RELINKING.md \
            LICENSE-MIT LICENSE-APACHE LICENSE-LGPL-2.1 LICENSE-LGPL-3.0 LICENSE-GPL-3.0 \
            SHA256SUMS; do
            curl --fail --silent --show-error --location \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$name" \
              --output "release/$name"
          done
          test "$(env -u GITHUB_TOKEN "$RUNNER_TEMP/oras" manifest fetch --descriptor \
            "$OCI_REPOSITORY:$VERSION" | jq -er .digest)" = "$PROVIDER_DIGEST"
          test "$(env -u GITHUB_TOKEN "$RUNNER_TEMP/oras" manifest fetch --descriptor \
            "$SOURCE_OCI_REPOSITORY:$VERSION" | jq -er .digest)" = "$SOURCE_DIGEST"
          env -u GITHUB_TOKEN "$RUNNER_TEMP/oras" pull "$OCI_REPOSITORY:$VERSION" --output provider
          env -u GITHUB_TOKEN "$RUNNER_TEMP/oras" pull "$SOURCE_OCI_REPOSITORY:$VERSION" --output source
          cp provider/python-provider.wasm source/python-provider.wasm
          ./scripts/verify-release-assets.sh release 0.1.0
          ./scripts/verify-release-assets.sh source 0.1.0
          diff -qr release source

  cleanup_failed_release:
    name: remove only this run's verified release and both OCI effects
    if: ${{ always() && failure() && needs.draft.outputs.release_id != '' }}
    needs: [build, draft, ghcr, finalize, post_release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Install pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Authenticate to GHCR with the job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify run ownership, then remove provider, source, and release in safe order
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          MARKER: ${{ needs.draft.outputs.marker }}
          PROVIDER_DIGEST: ${{ needs.ghcr.outputs.provider_manifest_digest }}
          SOURCE_DIGEST: ${{ needs.ghcr.outputs.source_manifest_digest }}
          PROVIDER_STAGING_REF: ${{ needs.ghcr.outputs.provider_staging_ref }}
          SOURCE_STAGING_REF: ${{ needs.ghcr.outputs.source_staging_ref }}
          PROVIDER_INITIAL_VISIBILITY: ${{ needs.ghcr.outputs.provider_initial_visibility }}
          SOURCE_INITIAL_VISIBILITY: ${{ needs.ghcr.outputs.source_initial_visibility }}
        shell: bash
        run: |
          set -euo pipefail
          run="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          release_owned=false
          if gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            >"$RUNNER_TEMP/release.json" 2>"$RUNNER_TEMP/release.err"; then
            jq -e --arg marker "$MARKER" \
              '.tag_name == "v0.1.0" and (.body | startswith($marker))' \
              "$RUNNER_TEMP/release.json" >/dev/null
            release_owned=true
          elif ! grep -Eqi 'not found|404' "$RUNNER_TEMP/release.err"; then
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi

          manifests="$RUNNER_TEMP/manifests.tsv"
          : >"$manifests"
          record_owned_manifest() {
            local repository=$1 digest=$2 label=$3
            [[ -n "$digest" ]] || return 0
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            if "$RUNNER_TEMP/oras" manifest fetch "$repository@$digest" \
              >"$RUNNER_TEMP/$label.json" 2>"$RUNNER_TEMP/$label.err"; then
              jq -e --arg run "$run" '.annotations["org.dekopon.release.run"] == $run' \
                "$RUNNER_TEMP/$label.json" >/dev/null
              descriptor=$("$RUNNER_TEMP/oras" manifest fetch --descriptor "$repository@$digest")
              test "$(jq -er .digest <<<"$descriptor")" = "$digest"
              printf '%s\t%s\n' "$repository" "$digest" >>"$manifests"
            elif ! grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN|404' \
              "$RUNNER_TEMP/$label.err"; then
              cat "$RUNNER_TEMP/$label.err" >&2
              return 1
            fi
          }
          if [[ -n "$PROVIDER_DIGEST" ]]; then
            test "$PROVIDER_STAGING_REF" = \
              "$OCI_STAGING_REPOSITORY:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            record_owned_manifest "$OCI_STAGING_REPOSITORY" "$PROVIDER_DIGEST" provider-stage
            record_owned_manifest "$OCI_REPOSITORY" "$PROVIDER_DIGEST" provider-final
          fi
          if [[ -n "$SOURCE_DIGEST" ]]; then
            test "$SOURCE_STAGING_REF" = \
              "$SOURCE_OCI_STAGING_REPOSITORY:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            record_owned_manifest "$SOURCE_OCI_STAGING_REPOSITORY" "$SOURCE_DIGEST" source-stage
            record_owned_manifest "$SOURCE_OCI_REPOSITORY" "$SOURCE_DIGEST" source-final
          fi

          # Delete binary manifests first. If that fails, keep source/release materials public
          # rather than creating a binary with no corresponding source.
          while IFS=$'\t' read -r repository digest; do
            [[ "$repository" == "$OCI_STAGING_REPOSITORY" || "$repository" == "$OCI_REPOSITORY" ]] || continue
            "$RUNNER_TEMP/oras" manifest delete --force "$repository@$digest"
          done <"$manifests"
          while IFS=$'\t' read -r repository digest; do
            [[ "$repository" == "$SOURCE_OCI_STAGING_REPOSITORY" || "$repository" == "$SOURCE_OCI_REPOSITORY" ]] || continue
            "$RUNNER_TEMP/oras" manifest delete --force "$repository@$digest"
          done <"$manifests"

          restore_private() {
            local package=$1 initial=$2
            if [[ "$initial" = private || "$initial" = absent ]]; then
              if gh api "/orgs/dekopon-agents/packages/container/$package" \
                >/dev/null 2>"$RUNNER_TEMP/$package.err"; then
                gh api --method PUT "/orgs/dekopon-agents/packages/container/$package/visibility" \
                  -f visibility=private >/dev/null
              elif ! grep -Eqi 'not found|404' "$RUNNER_TEMP/$package.err"; then
                cat "$RUNNER_TEMP/$package.err" >&2
                return 1
              fi
            fi
          }
          restore_private provider-python "$PROVIDER_INITIAL_VISIBILITY"
          restore_private provider-python-source "$SOURCE_INITIAL_VISIBILITY"
          if [[ "$release_owned" = true ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          fi
