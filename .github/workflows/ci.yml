name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROVIDER_MSRV: "1.93.0"
  PROVIDER_RUST_TOOLCHAIN: "1.97.0"
  WASM_TOOLS_VERSION: "1.236.1"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  DEKOPON_RUN_VERSION: "0.11.1"
  WASMTIME_VERSION: "48.0.0"

jobs:
  source:
    name: source, tests, and policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject source-controlled Wasm before running repository code
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.wasm')"
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_MSRV" --profile minimal
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
      - name: Install pinned policy, component, and workflow tools
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install cargo-deny \
            --version "$CARGO_DENY_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | \
            sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          install -m 0755 "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/actionlint-bin"
      - name: Format, lint, test, MSRV, target, lock, licenses, and notices
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$PROVIDER_RUST_TOOLCHAIN" fmt --all -- --check
          cargo +"$PROVIDER_RUST_TOOLCHAIN" clippy --locked --all-targets -- -D warnings
          cargo +"$PROVIDER_RUST_TOOLCHAIN" test --locked --all-targets
          cargo +"$PROVIDER_MSRV" check --locked --all-targets
          cargo +"$PROVIDER_RUST_TOOLCHAIN" check --locked --target wasm32-unknown-unknown
          ./scripts/assert-lock-and-feature-graph.sh Cargo.lock
          cargo deny check licenses advisories bans sources
          ./scripts/check-third-party-notices.sh Cargo.lock THIRD_PARTY_NOTICES.md
          bash -n scripts/*.sh
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.safe_load(File.read(f), aliases: true) }' \
            .github/workflows/*.yml
          "$RUNNER_TEMP/actionlint-bin" -color
          ./scripts/validate-workflows-and-release-layout.sh

  source_bundle:
    name: deterministic corresponding source and offline relink
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust, componentizer, and SBOM tool
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install cargo-cyclonedx \
            --version "$CARGO_CYCLONEDX_VERSION" --locked
      - name: Reproduce source bundle and relink modified Malachite offline
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-source-bundle.sh dist
          ./scripts/test-source-bundle-reproducibility.sh dist
          ./scripts/test-source-bundle-relink.sh \
            dist/dekopon-python-provider-0.1.0-relink-source.tar.gz \
            dist/dekopon-python-provider-0.1.0.cdx.json

  component:
    name: component and real hosts
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject source-controlled Wasm before running repository code
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.wasm')"
      - name: Install pinned Rust and wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
      - name: Install the release-authority host and independent oracle
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install dekopon-run \
            --version "$DEKOPON_RUN_VERSION" --locked
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasmtime-cli \
            --version "$WASMTIME_VERSION" --locked
      - name: Build and inspect the component
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-component.sh
          wasm-tools component wit -j python-provider.wasm >/tmp/python-provider-wit.json
          ./scripts/assert-provider-wit.sh /tmp/python-provider-wit.json
          ./scripts/assert-zero-core-imports.sh python-provider.wasm
          ./scripts/test-wasmtime-smoke.sh python-provider.wasm
      - name: Run protocol, module, YAML, immediate-resource, and broker-host tests
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test-component-protocol.sh python-provider.wasm
          ./scripts/test-supported-and-denied-modules.sh python-provider.wasm
          ./scripts/test-yaml-policy.sh python-provider.wasm
          ./scripts/test-immediate-resource-limits.sh python-provider.wasm
          ./scripts/test-broker-testkit.sh python-provider.wasm
      - name: Measure exact final artifact
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/measure-final-artifact.sh python-provider.wasm
          sha256sum --check --strict python-provider.wasm.sha256
          mkdir dist
          cp python-provider.wasm python-provider.wasm.sha256 \
            /tmp/dekopon-python-measurements.json dist/
      - name: Upload ignored review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-provider-component
          path: dist/
          if-no-files-found: error
          retention-days: 14

  reproducible:
    name: independent byte reproducibility
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source A
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source-a
          persist-credentials: false
      - name: Check out source B
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source-b
          persist-credentials: false
      - name: Install pinned Rust and wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          cargo +"$PROVIDER_RUST_TOOLCHAIN" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
      - name: Build independent checkouts and compare bytes
        shell: bash
        run: |
          set -euo pipefail
          (cd source-a && ./scripts/build-component.sh)
          rm -rf /tmp/dekopon-python-provider-canonical/target
          (cd source-b && ./scripts/build-component.sh)
          cmp source-a/python-provider.wasm source-b/python-provider.wasm
          cmp source-a/python-provider.wasm.sha256 source-b/python-provider.wasm.sha256
          wasm-tools validate source-a/python-provider.wasm
