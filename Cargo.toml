[workspace]

[package]
name = "dekopon-python-provider"
version = "0.6.3"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "A constrained RustPython evaluator with broker-granted HTTP for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-python"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["http"]
http = []

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
dekopon-provider-sdk = "=0.31.0"
schemars = "=1.2.2"
getrandom = "=0.3.4"
num-traits = "=0.2.19"
rustpython-common = "=0.5.0"
rustpython-pylib = { version = "=0.5.0", default-features = false, features = ["freeze-stdlib"] }
rustpython-stdlib = { version = "=0.5.0", default-features = false, features = ["compiler"] }
rustpython-vm = { version = "=0.5.0", default-features = false, features = ["compiler", "gc", "encodings", "freeze-stdlib"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
yaml-rust2 = { version = "=0.12.0", default-features = false }

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.31.0"
tempfile = "=3.27.0"
tokio = { version = "=1.49.0", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }

[patch.crates-io]
rustpython-derive-impl = { path = "patches/rustpython-derive-impl" }
rustpython-vm = { path = "patches/rustpython-vm" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
