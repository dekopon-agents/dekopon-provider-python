[workspace]

[package]
name = "dekopon-python-provider"
version = "0.7.0-alpha.1"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "A constrained RustPython evaluator with broker-granted HTTP for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-python"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[features]
default = ["http"]
http = ["dep:dekopon-provider-http"]
engine-swap = []

[dependencies]
dekopon-provider-http = { git = "https://github.com/dekopon-agents/dekopon.git", rev = "820ee7a521201828ed42171f1ead5e75026595d2", optional = true }
dekopon-provider-sdk = { git = "https://github.com/dekopon-agents/dekopon.git", rev = "820ee7a521201828ed42171f1ead5e75026595d2", features = ["clap"] }
datafusion = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c", default-features = false, features = ["sql", "dekopon-wasm", "string_expressions", "datetime_expressions"] }
ndarray = { version = "=0.17.2", default-features = false, features = ["std"] }
statrs = { version = "=0.19.1", default-features = false, features = ["std"] }
smartcore = { version = "=0.6.14", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt"] }
getrandom = "=0.3.4"
num-traits = "=0.2.19"
rustpython-common = "=0.5.0"
rustpython-pylib = { version = "=0.5.0", default-features = false, features = ["freeze-stdlib"] }
rustpython-stdlib = { version = "=0.5.0", default-features = false, features = ["compiler"] }
rustpython-vm = { version = "=0.5.0", default-features = false, features = ["compiler", "gc", "encodings", "freeze-stdlib"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# The SDK's own wit-bindgen, so the component carries one `cabi_realloc`. The bindings select the
# `provider-cli` world of the byte-pinned `wit/provider.wit` mirror, which exports `run-command`.
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }
yaml-rust2 = { version = "=0.12.0", default-features = false }

[dev-dependencies]
dekopon-capability = { git = "https://github.com/dekopon-agents/dekopon.git", rev = "820ee7a521201828ed42171f1ead5e75026595d2" }
dekopon-provider-sdk-testkit = { git = "https://github.com/dekopon-agents/dekopon.git", rev = "820ee7a521201828ed42171f1ead5e75026595d2" }
tempfile = "=3.27.0"
tokio = { version = "=1.52.4", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }

[patch.crates-io]
rustpython-derive-impl = { path = "patches/rustpython-derive-impl" }
rustpython-vm = { path = "patches/rustpython-vm" }
datafusion-catalog = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-catalog-listing = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-common = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-common-runtime = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-datasource = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-datasource-arrow = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-datasource-csv = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-datasource-json = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-execution = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-expr = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-expr-common = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-functions = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-functions-aggregate = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-functions-aggregate-common = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-functions-nested = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-functions-table = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-functions-window = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-functions-window-common = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-optimizer = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-physical-expr = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-physical-expr-adapter = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-physical-expr-common = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-physical-optimizer = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-physical-plan = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-pruning = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-session = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }
datafusion-sql = { git = "https://github.com/dekopon-agents/datafusion.git", rev = "cf3778098ad3ea283ecd8ee2a991be7d9a29750c" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
